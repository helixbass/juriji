[package]
name = "juriji"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8", features = [ "runtime-tokio", "tls-native-tls", "postgres", "json", "uuid" ] }
squalid = { git = "https://github.com/helixbass/squalid", rev = "aeb2045" }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.19.0", features = [ "v4", "serde" ] }
